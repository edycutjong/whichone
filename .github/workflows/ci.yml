name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify          # offline replay of 12 recorded verdicts — no API key in CI
      - run: npm run build -w apps/web
        env: { NANSEN_API_KEY: nsn_ci_placeholder_never_used_at_build }
      - run: npm run check
